name: Collect and publish Hardware Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 0,10 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: hardware-atlas-pages
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect public RSS and retain source health
        run: python3 scripts/collect.py
      - name: Validate content and collection behavior
        run: |
          python3 -m unittest discover -s tests -v
          node --check site/app.js
          node --test tests/education.test.mjs
      - name: Save discovery history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/radar.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh hardware discovery and source health'
            git push
          fi
      - name: Build static publication
        run: python3 scripts/build.py
      - name: Report content freshness separately from deployment
        run: python3 scripts/health.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
